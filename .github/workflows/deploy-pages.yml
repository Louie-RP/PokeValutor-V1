name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static artifact
        shell: bash
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: |
          set -euo pipefail

          mkdir -p dist
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'functions/' \
            --exclude 'node_modules/' \
            --exclude '.gitignore' \
            --exclude 'README.md' \
            --exclude 'firebase.json' \
            --exclude 'firestore.rules' \
            --exclude 'firebase-config.local.example.js' \
            --exclude 'dist/' \
            ./ dist/

          # Generate firebase-config.js from GitHub Secrets (keeps API keys out of git history)
          cat > dist/firebase-config.js <<'EOF'
          // Firebase client config.
          // NOTE: This file is generated at deploy time via GitHub Actions.

          (function () {
            window.PV_FIREBASE_CONFIG = {
              apiKey: "__FIREBASE_API_KEY__",
              authDomain: "__FIREBASE_AUTH_DOMAIN__",
              projectId: "__FIREBASE_PROJECT_ID__",
              appId: "__FIREBASE_APP_ID__",
              messagingSenderId: "__FIREBASE_MESSAGING_SENDER_ID__",
              storageBucket: "__FIREBASE_STORAGE_BUCKET__",
            };
          })();
          EOF

          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path('dist/firebase-config.js')
          s = p.read_text(encoding='utf-8')

          repl = {
              '__FIREBASE_API_KEY__': os.environ.get('FIREBASE_API_KEY',''),
              '__FIREBASE_AUTH_DOMAIN__': os.environ.get('FIREBASE_AUTH_DOMAIN',''),
              '__FIREBASE_PROJECT_ID__': os.environ.get('FIREBASE_PROJECT_ID',''),
              '__FIREBASE_APP_ID__': os.environ.get('FIREBASE_APP_ID',''),
              '__FIREBASE_MESSAGING_SENDER_ID__': os.environ.get('FIREBASE_MESSAGING_SENDER_ID',''),
              '__FIREBASE_STORAGE_BUCKET__': os.environ.get('FIREBASE_STORAGE_BUCKET',''),
          }

          for k, v in repl.items():
              s = s.replace(k, v.replace('\\', '\\\\').replace('"', '\\"'))

          p.write_text(s, encoding='utf-8')
          PY

            # Create safe no-op files for optional local-only script tags used by pages.
            cat > dist/firebase-config.local.js <<'EOF'
            // Optional local Firebase override placeholder for production deploys.
            EOF

            cat > dist/secrets.js <<'EOF'
            // Optional local secrets placeholder for production deploys.
            window.PV_SECRETS = window.PV_SECRETS || {};
            EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
