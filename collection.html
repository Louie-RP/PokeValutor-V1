            <p id="pv-collection-total" class="pv-collectionTotal" role="status" aria-live="polite" aria-atomic="true">Collection Value: $0.00</p>

            <p id="pv-collection-summary" class="pv-section__text" role="status" aria-live="polite" aria-atomic="true"></p>
