<body id="pv-sealed-body" class="pv-body">
    <a class="pv-skiplink" href="#pv-sealed-main">Skip to content</a>

    <header id="pv-sealed-header" class="pv-header" role="banner">
        <div class="pv-header__inner" aria-label="Site header">
            <a id="pv-sealed-brand" class="pv-brand" href="index.html" aria-label="Back to home">PokéValutor</a>
            <button id="pv-sealed-navToggle" class="pv-navToggle" aria-expanded="false" aria-controls="pv-sealed-nav" aria-label="Toggle navigation">
                <span class="pv-navToggle__bar" aria-hidden="true"></span>
                <span class="pv-navToggle__bar" aria-hidden="true"></span>
                <span class="pv-navToggle__bar" aria-hidden="true"></span>
            </button>
            <nav id="pv-sealed-nav" class="pv-nav" aria-label="Primary" aria-expanded="false">
                <ul class="pv-nav__list">
                    <li class="pv-nav__item"><a class="pv-nav__link" href="index.html">Home</a></li>
                    <li class="pv-nav__item"><a class="pv-nav__link" href="search.html">Cards</a></li>
                    <li class="pv-nav__item"><a class="pv-nav__link" href="sealed.html">Sealed</a></li>
                    <li class="pv-nav__item"><a class="pv-nav__link" href="account.html">Account</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="pv-sealed-main" class="pv-main" role="main">
        <section id="pv-sealed-hero" class="pv-hero container" aria-labelledby="pv-sealed-title">
            <h1 id="pv-sealed-title" class="pv-hero__title">Search Sealed Product</h1>
            <p class="pv-hero__subtitle">Find sealed products by name and view market values.</p>
        </section>

        <section id="pv-sealed-section" class="pv-section container">
            <form id="pv-sealed-form" class="pv-form row g-3" role="search">
                <div class="pv-form__field col-12 col-md-8">
                    <label for="pv-sealed-query" class="form-label">Product Name</label>
                    <input id="pv-sealed-query" name="pv-sealed-query" type="search" class="form-control"
                        placeholder="e.g., Phantasmal Flames Booster Box" aria-controls="pv-sealed-results" />
                </div>
                <div class="col-12">
                    <button id="pv-sealed-submit" class="pv-button pv-button--primary btn" type="submit">Search</button>
                    <button id="pv-sealed-clear" class="pv-button pv-button--secondary btn ms-2" type="button">Clear Results</button>
                </div>
            </form>

            <div id="pv-sealed-status" class="pv-section__text" role="status" aria-live="polite" aria-atomic="true"></div>
            <section id="pv-sealed-results" class="pv-section" aria-labelledby="pv-sealed-results-title">
                <h2 id="pv-sealed-results-title" class="pv-section__title">Results</h2>
                <div id="pv-quota-banner" class="pv-quotaBanner" role="status" aria-live="polite" aria-atomic="true" hidden>
                    <div class="pv-quotaBanner__message" id="pv-quota-message"></div>
                    <a id="pv-quota-cta" class="pv-button pv-button--primary btn pv-quotaBanner__cta" href="account.html" hidden>Sign in</a>
                </div>
                <div id="pv-sealed-grid" class="row g-3" aria-label="Sealed products results grid"></div>
            </section>

            <section id="pv-sealed-favorites" class="pv-section" aria-labelledby="pv-sealed-favorites-title">
                <div class="pv-section__header">
                    <h2 id="pv-sealed-favorites-title" class="pv-section__title">Watchlist <span id="pv-sealed-favorites-totals" class="small text-muted ms-2" aria-live="polite"></span></h2>
                    <div>
                        <button id="pv-sealed-favorites-toggle" class="pv-button pv-button--primary btn" type="button"
                            aria-controls="pv-sealed-favorites-body" aria-expanded="true">Hide</button>
                        <button id="pv-sealed-favorites-clear" class="pv-button pv-button--secondary btn ms-2" type="button">Clear</button>
                    </div>
                </div>
                <div id="pv-sealed-favorites-body">
                    <div id="pv-sealed-favorites-grid" class="row g-3" aria-label="Sealed watchlist grid"></div>
                </div>
            </section>
        </section>
    </main>

    <footer id="pv-sealed-footer" class="pv-footer" role="contentinfo">
        <div class="pv-footer__inner">
            <p class="pv-footer__text">© <span id="pv-year"></span> PokéValutor. All rights reserved.</p>

                <li><a id="pv-sealed-access" href="policies.html#pv-accessibility">Accessibility</a></li>
                <li><a id="pv-sealed-contact" href="contact.html">Contact</a></li>
            </ul>
        </div>

</body>
